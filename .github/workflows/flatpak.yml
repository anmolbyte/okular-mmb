name: Build Flatpak

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Get Okular version from manifest
        id: version
        run: |
          TAG=$(grep -oP '"tag":\s*"\Kv[^"]+' .flatpak-manifest.json | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: okular-mmb.flatpak
          manifest-path: .flatpak-manifest.json
          cache-key: flatpak-builder-${{ github.sha }}
          run-tests: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: okular-mmb-flatpak
          path: okular-mmb.flatpak

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: okular-mmb.flatpak
          tag_name: ${{ steps.version.outputs.tag }}-mmb
          name: Okular-MMB (${{ steps.version.outputs.tag }})
          body: |
            Okular-MMB built from KDE Okular ${{ steps.version.outputs.tag }} with middle-mouse-button autoscroll support.

            Install: `flatpak install okular-mmb.flatpak`
          draft: false
          prerelease: false
          make_latest: true
